[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb2"
version = "0.1.0"
description = "Reimplementation of clockblocks library"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"

authors = [
    { name = "Marc Evanstein", email = "marc@marcevanstein.com" }
]

dependencies = [
    "expenvelope>=0.7.3"
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
